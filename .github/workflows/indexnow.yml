name: IndexNow ping
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages deploy
        run: sleep 90
      - name: Notify IndexNow
        run: |
          # URLs come from the committed sitemap, not a hardcoded list that
          # silently goes stale. Read the checkout rather than the live file:
          # the Pages CDN caches for ~10 minutes, so a fetch this soon after a
          # push often still serves the previous version.
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          echo "Submitting $(echo "$URLS" | jq 'length') URLs"
          BODY=$(jq -nc \
            --arg h "kawikalopez.com" \
            --arg k "d46e2ec9e36d6a96a29b21c93550a3ad" \
            --argjson u "$URLS" \
            '{host: $h, key: $k, keyLocation: ("https://" + $h + "/" + $k + ".txt"), urlList: $u}')
          CODE=$(curl -s -o answer.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY")
          echo "IndexNow responded $CODE"
          cat answer.txt; echo
          # 200 and 202 mean accepted. Anything else is flagged as a warning on the run, not a
          # failure, so a rejection shows in the Actions log without emailing on every push.
          case "$CODE" in 200|202) ;; *) echo "::warning title=IndexNow rejected::IndexNow answered $CODE" ;; esac
