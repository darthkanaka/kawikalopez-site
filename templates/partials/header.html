<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ url('') }}">
      <img class="logo logo-horizontal" src="{{ asset('assets/img/site/logo-horizontal.svg') }}" width="4092" height="995" alt="Kawika Lopez Photography">
    </a>
    <nav class="nav" aria-label="Main">
      <ul class="nav-list">
        {% for n in nav %}
        <li><a href="{{ url(n.href) }}"{% if n.href == path %} aria-current="page"{% endif %}>{{ n.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <details class="menu">
      <summary><span class="menu-label">Menu</span></summary>
      <ul class="menu-list">
        {% for n in nav %}
        <li><a href="{{ url(n.href) }}"{% if n.href == path %} aria-current="page"{% endif %}>{{ n.label }}</a></li>
        {% endfor %}
      </ul>
    </details>
  </div>
</header>
