# Site-wide facts. The build reads this for the header, footer, schema and canonical URLs.

name: Kawika Lopez Photography
short_name: Kawika Lopez
legal_name: Veex Photo LLC
tagline: Hawaiʻi landscape prints, printed on Oʻahu
description: >-
  Fine art landscape and aerial prints of Hawaiʻi by Kawika Lopez, printed here on
  Oʻahu on metal or canvas, or as matted prints from $55.

