# Order promises used by the terms page. ship_within_days is a commitment under the FTC mail order
# rule: the order ships (or is ready for pickup) within this many business days, or the buyer gets
# a delay notice with the option to cancel. Keep it above the lab's worst case.
ship_within_days: 14
statement_descriptor: KAWIKALOPEZ.COM

person:
  name: Kawika Lopez
  job_title: Landscape and aerial photographer
  locality: Honolulu
  region: HI
  same_as:
    - https://www.facebook.com/kawikalopezphotography/
    - https://fstoppers.com/u/kawika

# The site says prints are made here on Oʻahu and never names the lab (Kawika, 2026-09-25; "here"
# rather than "locally" since 2026-09-29, so it reads as his own place, not a local shop).
# `lab` is for our records only; no template uses it.
printer:
  lab: Pictures Plus, Kapolei
  turnaround: about a week

# The size and material picker (Release B, from Kawika's decision paralysis report, approved 2026-09-29).
# Three named sizes per print; the default size carries pick_label. Kawika's wording for the material
# line and the matted print description, approved 2026-09-29.
picker:
  tiers: {accent: Accent, signature: Signature, statement: Statement}
  pick_label: Kawika's pick
  more_label: More sizes
  default_material: metal
  material_help: Kawika has always leaned toward metal as his preferred way to show a photograph. The color comes out bright and deep, with a clean, modern look.
  matted:
    name: Matted print
    lead: Or a smaller matted print
    description: A smaller, simpler way to bring one of these photographs home. It's printed here on Oʻahu on 275-gram satin photo paper, with rich color and a smooth, scratch-resistant finish. It's set in an acid-free white mat, 11 x 14 on the outside, with a backing board and a clear sleeve to keep it clean. Vertical photos are 8 x 10 and horizontal ones are 8 x 12, and both fit any standard 11 x 14 frame.

# Print page copy. A line shows only once confirmed is true (Kawika approves each one).
product_copy:
  facts:
    - text: From the photograph to the finished print, every order goes through Kawika
      confirmed: true
  returns: All sales are final, except damage or defects, which we replace free. You can cancel within 24 hours.
  returns_confirmed: true   # Kawika approved 2026-09-29

promo:
  code: NEW20OFF
  text: 20% off your first print

# Home page order for the featured prints (mixes panoramas with the rest so rows share space).
featured_order: [naniwaikiki, malie, kaaawasunrise, makapuubeach-v, kaimana, mokulua, puao, kaaawavalley]

# Analytics are emitted on production builds only.
ga4: "G-SLYRYDKNHR"

# Flags that change links while pages are still being built.
features:
  visualizer_page: false      # /see-it-in-your-space exists
  checkout: true              # payment links in data/payment-links-test.json (staging) and -live.json (production)
  blog: false
  places: false

nav:
