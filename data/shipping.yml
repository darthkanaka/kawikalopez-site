# Shipping at checkout. Read by tools/build.py and tools/stripe_catalog.py.
#
# Kawika, 2026-09-25: free pickup on Oʻahu, otherwise a flat rate by print size, material and
# destination. A payment link can offer at most 5 shipping options; each one offers pickup plus
# one rate per zone for that exact size and material. Pictures Plus ships nothing larger than
# 60 x 30 inches, so bigger sizes are pickup only.
#
# Rates, 2026-09-26: quoted on the Pictures Plus shipping calculator (354 lookups, 16 ZIPs, raw
# data in harvest/shipping-quotes.csv). Mainland quotes are one "US Domestic" price per size,
# the same in every state tested (Anchorage included), so the three mainland zones became one.
# Charged amount = highest quote in the zone x 1.08, rounded up to the next dollar. The 8%
# covers the 4.5% GET and the Stripe fee on the shipping charge. Amounts are in cents.
#
# Kawika approved the rule and the rates 2026-09-26 (rates_confirmed: true). stripe_catalog.py
# refuses to run in live mode while rates_confirmed is false.

rates_confirmed: true
currency: usd
allowed_countries: [US]
max_ship_long_edge_in: 60
max_ship_short_edge_in: 30       # the lab ships nothing larger than 60 x 30

pickup:
  label: Free pickup on Oʻahu
  amount: 0
  days: [7, 10]

# days: business days from order to delivery, production (about a week) plus transit.
# handling_days (making and checking the print) plus a zone's transit_days add up to its days.
# days_confirmed: the windows show on print pages and in Google's listing data only when true.
# Kawika approved showing them 2026-09-29 (checkout already showed them).
handling_days: [7, 10]
transit_days: {hi: [0, 4], mainland: [3, 11]}
days_confirmed: true
zones:
  - {id: hi, label: Hawaiʻi, days: [7, 14]}
  - {id: mainland, label: US mainland, days: [10, 21]}

# Keyed by material, then size as width x height in inches (either orientation matches).
# matted (Kawika, 2026-09-29): Kawika mats and ships these himself by USPS Ground Advantage, so they
# don't use the lab's rates. Charge = commercial postage (up to 1 lb: zone 4 $8.15, zones 8 and 9
# $10.67, July 2026 prices) plus a $1.26 rigid mailer, x 1.08, rounded up to the next dollar.
rates:
  matted:
    "8x10": {hi: 1100, mainland: 1300}
    "8x12": {hi: 1100, mainland: 1300}
  metal:
    "16x16": {hi: 3900, mainland: 9200}   # quote $35.42 / $85.00
    "16x20": {hi: 4300, mainland: 9200}   # quote $39.26 / $85.00
    "18x12": {hi: 3600, mainland: 9200}   # quote $33.02 / $85.00
    "20x25": {hi: 5500, mainland: 10300}   # quote $50.06 / $95.00
    "24x16": {hi: 4700, mainland: 9200}   # quote $43.10 / $85.00
    "24x24": {hi: 5900, mainland: 10800}   # quote $54.62 / $100.00
    "24x30": {hi: 6900, mainland: 11400}   # quote $63.26 / $105.00
    "30x10": {hi: 4200, mainland: 9200}   # quote $38.06 / $85.00
    "30x20": {hi: 6100, mainland: 10800}   # quote $56.06 / $100.00
    "36x24": {hi: 7800, mainland: 15700}   # quote $71.90 / $145.00
    "48x16": {hi: 7200, mainland: 11400}   # quote $66.14 / $105.00
  canvas:
    "16x16": {hi: 3900, mainland: 9200}   # quote $35.48 / $85.00
    "16x20": {hi: 4300, mainland: 9200}   # quote $39.32 / $85.00
    "18x12": {hi: 3600, mainland: 9200}   # quote $33.08 / $85.00
    "20x25": {hi: 5500, mainland: 10300}   # quote $50.12 / $95.00
    "24x16": {hi: 4700, mainland: 9200}   # quote $43.16 / $85.00
    "24x24": {hi: 6000, mainland: 10800}   # quote $54.68 / $100.00
    "24x30": {hi: 6900, mainland: 11400}   # quote $63.32 / $105.00
    "30x10": {hi: 4200, mainland: 9200}   # quote $38.12 / $85.00
    "30x20": {hi: 6100, mainland: 10800}   # quote $56.12 / $100.00
    "36x24": {hi: 7800, mainland: 15700}   # quote $71.96 / $145.00
    "48x16": {hi: 7200, mainland: 11400}   # quote $66.20 / $105.00

oversize:
  options: [pickup]
  note: Sizes over 60 x 30 inches are pickup only. Get in touch and we'll quote freight.

# Cart shipping (2026-09-26): the lab prices an order by its total square inches, so a cart
# of several prints is priced as one order. Model probed on the lab's calculator, notes in
# harvest/shipping-calculator-model.md. Kawika: the lab only ever bills what it quotes at checkout.
# Used by the cart page (assets/js/site.js) and the checkout service (gas/checkout.gs), which
# read it from assets/data/cart.json. tools/test_shipping.mjs checks both against the quotes.
#   Hawaiʻi: base + per square inch + per print (+ per canvas print), one lab order.
#   Mainland: a step price by total square inches. Above `box_max_sq_in` the lab jumps to
#   freight pricing ($410+), so the order is split into boxes that each stay under it, and
#   Kawika places one lab order per box.
#   Charge = the lab quote x markup, rounded up to the next dollar.
cart:
  markup_pct: 108
  hi: {base: 2000, per_sq_in: 6, per_print: 6, per_canvas_print: 6}
  mainland_box_max_sq_in: 1320
  # [up to this many square inches, cents]. Between probed points the higher step applies.
  mainland_steps:
    - [50, 4000]
    - [100, 5500]
    - [150, 6500]
    - [180, 7400]
    - [210, 7800]
    - [420, 8500]
    - [450, 9000]
    - [550, 9500]
    - [650, 10000]
    - [780, 10500]
    - [820, 11500]
    - [850, 13800]
    - [1000, 14500]
    - [1100, 15000]
    - [1320, 15500]
  max_items: 10
  max_qty: 5
  # Matted prints ship from Kawika, not the lab: one mailer holds up to three, and each mailer is a
  # flat charge on top of any lab shipping in the same order (cents, already marked up).
  matted: {per_mailer: 3, hi: 1100, mainland: 1300}
