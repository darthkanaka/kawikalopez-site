# Shipping at checkout. Read by tools/stripe_catalog.py and by the product page copy.
#
# Kawika, 2026-09-25: free pickup on Oʻahu, otherwise a rate by size and destination.
# Stripe shipping rates are fixed amounts and a payment link can offer at most 5, so each
# print size gets: pickup, plus one rate per zone for its size tier. The customer picks
# their zone at checkout. Pictures Plus ships nothing larger than 60 x 30 inches, so any
# size with a long edge over 60 inches is pickup only.
#
# AMOUNTS ARE PLACEHOLDERS (cents). rates_confirmed stays false until Kawika supplies them,
# and stripe_catalog.py refuses to run in live mode while it is false.

rates_confirmed: false
currency: usd
allowed_countries: [US]
max_ship_long_edge_in: 60

pickup:
  label: Free pickup on Oʻahu
  amount: 0
  days: [7, 10]

zones:
  - {id: hi, label: Hawaiʻi}
  - {id: west, label: US West}
  - {id: mid, label: US Central and Mountain}
  - {id: east, label: US East}

tiers:
  - id: small
    max_long_edge_in: 24
    days: [7, 14]
    rates: {hi: 0, west: 0, mid: 0, east: 0}
  - id: medium
    max_long_edge_in: 36
    days: [7, 14]
    rates: {hi: 0, west: 0, mid: 0, east: 0}
  - id: large
    max_long_edge_in: 60
    days: [10, 21]
    rates: {hi: 0, west: 0, mid: 0, east: 0}

oversize:
  options: [pickup]
  note: Sizes over 60 inches are pickup only. Get in touch and we'll quote freight.

# Which checkout option a customer should pick, by state. Shown as a helper on product pages.
zone_hint:
  hi: [HI]
  west: [AK, AZ, CA, NV, OR, WA]
  mid: [AR, CO, IA, ID, IL, KS, LA, MN, MO, MS, MT, ND, NE, NM, OK, SD, TX, UT, WI, WY]
  east: [AL, CT, DC, DE, FL, GA, IN, KY, MA, MD, ME, MI, NC, NH, NJ, NY, OH, PA, RI, SC, TN, VA, VT, WV]
