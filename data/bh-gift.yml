# ~/Documents/Obsidian/projects/bakers-heart-gift-collab-tasks.md.
#
# publish: false keeps the page out of production builds (set KL_BH_PREVIEW=1 to build it locally).
#   It turns true at launch, after Robin's team approves the page.
# mode: test until launch. indexable: false until launch (then the page joins the sitemap).
# endpoint: the Apps Script web app URL. KL_BH_ENDPOINT overrides it for local testing.
publish: false
mode: test
indexable: false
endpoint: "https://script.google.com/macros/s/AKfycbwfSccE9-y0aBCekSYRfA0aU9QothRkjeJxHoHS-md_mhWemVBmX_4xh8NSKwDjq43O/exec"

