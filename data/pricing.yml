# Size and price matrix per orientation, derived from the Squarespace catalog on 2026-09-25.
# New prints inherit the matrix of their orientation. Prices in whole dollars.
# Edit here to change prices for every print of an orientation; per-print prices live in products.json.
# default: true marks the size a print page opens on (tools/build.py pick_defaults). One per shape.
# tier names the three sizes on the print page (accent, signature, statement, set in site.yml picker);
# more: true puts a size under "More sizes" instead. Release B, Kawika 2026-09-29: the middle size is the
# default everywhere and carries "Kawika's pick" until he names his own pick per print (overrides.yml default_size).
# tools/harvest_to_data.py carries these extra keys over if it ever rewrites this file.
vertical:
- size: 16 x 20
  w: 16
  h: 20
  canvas: 300
  metal: 300
  tier: accent
- size: 20 x 25
  w: 20
  h: 25
  canvas: 450
  metal: 570
  tier: signature
  default: true
- size: 24 x 30
  w: 24
  h: 30
  canvas: 570
  metal: 700
  tier: statement
horizontal:
