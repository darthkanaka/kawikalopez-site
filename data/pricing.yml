# Matted paper prints (Kawika, 2026-09-29): one size per shape, $55, printed on the lab's 275-gram
# satin photo paper and set in an acid-free white 11 x 14 mat with a backing board and a clear
# sleeve. Kawika mats and ships these himself. Only vertical (4:5) and horizontal (3:2) photos fit
# a standard mat; panoramas and squares stay canvas and metal. w and h are the print; mat is the
# outside of the mat and its opening, as the wall preview draws it (inches, width x height).
matted:
  vertical: {size: 8 x 10, w: 8, h: 10, price: 55, mat: {w: 11, h: 14, open_w: 7.8, open_h: 9.8}}
  horizontal: {size: 8 x 12, w: 8, h: 12, price: 55, mat: {w: 14, h: 11, open_w: 11.5, open_h: 7.5}}
