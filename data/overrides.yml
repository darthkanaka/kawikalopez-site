# Hand edits on top of data/products.json, keyed by urlId. Every key is optional.
#
#   title          display name (h1, cards, schema)
#   subtitle       short searchable phrase shown under the title and used in the <title> tag
#   alt            describes the photograph: place, light, what is in the frame
#   location       slug in data/locations.yml; links the print to its place page
#   island         shown in specs and schema
#   seo_title      replaces the generated <title> (keep it near 60 characters)
#   seo_description replaces the generated meta description (keep it under 155)
#   story          extra markdown shown after the description
#   fixes          [[wrong, right], ...] spelling fixes applied to the Squarespace description.
#                  Kawika's words are kept; only typos are corrected. The build warns if a
#                  "wrong" string is no longer found, so fixes never silently rot.
#   sort           lower comes first in grids (default 100)
#   featured       true shows the print on the home page
#   status         removed (dropped everywhere) or pending (kept out until its image exists)
#   draft          true renders the page with noindex and keeps it out of grids and the sitemap
#   image          source image path, relative to the repo, when it is not harvest/images/originals/<urlId>.jpg
#   orientation    only for prints that did not come from Squarespace
#
# Names for 036, 037, 038, 043, the removal of 041 and the new Olomana: Kawika, 2026-09-25.

