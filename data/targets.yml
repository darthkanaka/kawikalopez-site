# Target phrase registry: one entry per page we want to rank, and the searches it is written for.
# The SEO plan (vault projects/kawikalopez-seo-plan.md) picks new pages from Search Console data
# and adds them here. tools/build.py checks every entry:
#   - `page` must be an indexable page in this build
#   - `phrase` must appear in that page's <title> (ʻokina, kahakō and case ignored)
# `queries` are what people actually type (usually without ʻokina or kahakō); the monthly report
# matches Search Console queries against them.
#   cluster: place, gift, subject, island-type, buying, room, brand
#   volume:  Keyword Planner range, or "gsc: N/mo" once Search Console has data, or blank

- phrase: Hawaiʻi wall art prints
  page: store/
  cluster: island-type
  queries: [hawaii wall art prints, hawaii wall art, hawaii prints for sale]
  priority: 1
- phrase: Kawika Lopez
  page: ""
  cluster: brand
  queries: [kawika lopez, kawika lopez photography, kawika lopez prints]
  priority: 1
